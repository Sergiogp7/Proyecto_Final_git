spring.application.name=proyecto_final

spring.datasource.url=jdbc:mysql://localhost:3306/proyectofinal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.mvc.static-path-pattern=/**

# Desactivar cacheo de Spring
spring.cache.type=none

# Desactivar cacheo de segundo nivel y de consultas de Hibernate
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Desactivar cacheo de recursos estaticos (navegador)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
