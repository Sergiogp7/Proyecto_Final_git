<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymCore - Mi Carrito</title>
    <link rel="stylesheet" href="../Estilos/estilos.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <nav
      class="bg-white/80 backdrop-blur-lg border-b border-gray-200/80 sticky top-0 z-50 shadow-sm"
    >
      <div class="container mx-auto px-6">
        <div class="flex items-center justify-between h-20">
          <div
            class="flex items-center gap-3 cursor-pointer group"
            onclick="window.location.href = 'Home.html'"
          >
            <div
              class="bg-gradient-to-br from-orange-500 to-orange-600 p-2.5 rounded-xl shadow-md shadow-orange-500/20 group-hover:shadow-lg group-hover:shadow-orange-500/30 transition-all duration-300"
            >
              <i data-lucide="dumbbell" class="w-6 h-6 text-white"></i>
            </div>
            <div>
              <span
                class="block text-2xl tracking-tight bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent font-bold"
                >GymCore</span
              >
              <span
                class="block text-[10px] text-gray-500 tracking-wider -mt-0.5 font-medium"
                >ELITE FITNESS</span
              >
            </div>
          </div>
          <div class="hidden md:flex items-center gap-2">
            <button
              data-nav-id="home"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="home" class="w-4 h-4 mr-2"></i> Inicio
            </button>
            <button
              data-nav-id="shop"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="shopping-bag" class="w-4 h-4 mr-2"></i> Tienda
            </button>
            <button
              data-nav-id="bookings"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="calendar" class="w-4 h-4 mr-2"></i> Reservas
            </button>
            <button
              data-nav-id="social"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="users" class="w-4 h-4 mr-2"></i> Comunidad
            </button>
          </div>
          <div class="flex items-center gap-3">
            <button
              onclick="gestionarCarrito()"
              data-nav-id="cart"
              class="relative text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="shopping-cart" class="w-5 h-5"></i>
              <span
                id="cartBadge"
                class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center p-0 bg-gradient-to-r from-orange-500 to-orange-600 text-[10px] border-2 border-white text-white rounded-full"
                >0</span
              >
            </button>
            <button
              onclick="gestionarNotificaciones()"
              class="relative text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="bell" class="w-5 h-5"></i>
              <span
                class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center p-0 bg-gradient-to-r from-orange-500 to-orange-600 text-[10px] border-2 border-white text-white rounded-full"
                >3</span
              >
            </button>
            <div class="h-6 w-px bg-gray-200"></div>
            <button
              onclick="gestionarNavegacion('profile')"
              data-nav-id="profile"
              class="text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <div
                class="w-8 h-8 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white"
              >
                <i data-lucide="user" class="w-5 h-5"></i>
              </div>
            </button>
            <button
              onclick="gestionarNavegacion('logout')"
              class="text-gray-600 hover:text-red-600 hover:bg-red-50 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
        <div
          class="md:hidden flex items-center gap-2 pb-4 overflow-x-auto scrollbar-hide"
        >
          <button
            data-nav-id="home"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="home" class="w-4 h-4 mr-2"></i> Inicio
          </button>
          <button
            data-nav-id="shop"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="shopping-bag" class="w-4 h-4 mr-2"></i> Tienda
          </button>
          <button
            data-nav-id="bookings"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="calendar" class="w-4 h-4 mr-2"></i> Reservas
          </button>
          <button
            data-nav-id="social"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="users" class="w-4 h-4 mr-2"></i> Comunidad
          </button>
        </div>
      </div>
    </nav>

    <div class="min-h-screen bg-gradient-to-b from-gray-50 to-white py-12">
      <div class="container mx-auto px-6">
        <div class="mb-12">
          <div
            class="inline-flex items-center rounded-full border px-4 py-1.5 text-xs font-semibold bg-orange-100 text-orange-700 border-orange-200 mb-4"
          >
            <i data-lucide="shopping-bag" class="w-3.5 h-3.5 mr-1.5"></i> Tu
            Cesta
          </div>
          <h1
            class="text-5xl tracking-tight bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent font-medium"
          >
            Carrito de Compras
          </h1>
        </div>

        <div class="grid lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2 space-y-4" id="cartItemsContainer">
            <div
              class="text-center py-12 bg-white rounded-xl border border-gray-200"
            >
              <i
                data-lucide="shopping-cart"
                class="w-12 h-12 text-gray-300 mx-auto mb-4"
              ></i>
              <p class="text-gray-500 text-lg">Tu carrito está vacío</p>
              <button
                onclick="window.location.href = 'Shop.html'"
                class="mt-4 text-orange-600 font-medium hover:underline"
              >
                Volver a la tienda
              </button>
            </div>
          </div>

          <div class="space-y-6">
            <div
              class="rounded-xl border bg-card text-card-foreground shadow p-8 bg-white border-gray-200 sticky top-24"
            >
              <h2 class="text-2xl font-bold mb-6">Resumen del Pedido</h2>
              <div class="space-y-4 mb-6">
                <div class="flex justify-between text-gray-600">
                  <span>Subtotal</span><span id="cartSubtotal">€0.00</span>
                </div>
                <div class="flex justify-between text-gray-600">
                  <span>Envío</span><span class="text-green-600">Gratis</span>
                </div>
                <div
                  class="border-t border-gray-100 pt-4 flex justify-between text-xl font-bold text-gray-900"
                >
                  <span>Total</span><span id="cartTotal">€0.00</span>
                </div>
              </div>
              <div class="space-y-3">
                <input
                  type="text"
                  placeholder="Código de descuento"
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-500"
                />
                <button
                  id="checkoutBtn"
                  onclick="gestionarPago()"
                  class="w-full h-12 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 shadow-md shadow-orange-500/20 text-white font-medium rounded-lg transition-all flex items-center justify-center"
                >
                  Proceder al Pago
                </button>
              </div>
              <div
                class="mt-6 flex items-center justify-center gap-4 text-gray-400"
              >
                <i data-lucide="credit-card" class="w-6 h-6"></i>
                <i data-lucide="smartphone" class="w-6 h-6"></i>
                <i data-lucide="shield-check" class="w-6 h-6"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/Funcionalidad/global.js"></script>
    <script src="/Funcionalidad/cart.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
