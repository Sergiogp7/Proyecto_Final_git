<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymCore - Comunidad</title>
    <link rel="stylesheet" href="../Estilos/estilos.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .liked {
        fill: #f97316;
        color: #f97316;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Navigation -->
    <nav
      class="bg-white/80 backdrop-blur-lg border-b border-gray-200/80 sticky top-0 z-50 shadow-sm"
    >
      <div class="container mx-auto px-6">
        <div class="flex items-center justify-between h-20">
          <div
            class="flex items-center gap-3 cursor-pointer group"
            onclick="window.location.href = 'Home.html'"
          >
            <div
              class="bg-gradient-to-br from-orange-500 to-orange-600 p-2.5 rounded-xl shadow-md shadow-orange-500/20 group-hover:shadow-lg group-hover:shadow-orange-500/30 transition-all duration-300"
            >
              <i data-lucide="dumbbell" class="w-6 h-6 text-white"></i>
            </div>
            <div>
              <span
                class="block text-2xl tracking-tight bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent font-bold"
                >GymCore</span
              >
              <span
                class="block text-[10px] text-gray-500 tracking-wider -mt-0.5 font-medium"
                >ELITE FITNESS</span
              >
            </div>
          </div>
          <!-- Desktop Nav -->
          <div class="hidden md:flex items-center gap-2">
            <button
              data-nav-id="home"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="home" class="w-4 h-4 mr-2"></i> Inicio
            </button>
            <button
              data-nav-id="shop"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="shopping-bag" class="w-4 h-4 mr-2"></i> Tienda
            </button>
            <button
              data-nav-id="bookings"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="calendar" class="w-4 h-4 mr-2"></i> Reservas
            </button>
            <button
              data-nav-id="social"
              class="relative h-11 px-4 transition-all duration-300 bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-md shadow-orange-500/20 hover:shadow-lg hover:shadow-orange-500/30 rounded-md flex items-center"
            >
              <i data-lucide="users" class="w-4 h-4 mr-2"></i> Comunidad
              <div
                class="absolute -bottom-[21px] left-1/2 -translate-x-1/2 w-1/2 h-0.5 bg-gradient-to-r from-transparent via-orange-500 to-transparent"
              ></div>
            </button>
          </div>
          <!-- User Menu -->
          <div class="flex items-center gap-3">
            <button
              onclick="gestionarBusquedaGlobal()"
              class="relative text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="search" class="w-5 h-5"></i>
            </button>
            <button
              data-nav-id="cart"
              class="relative text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="shopping-cart" class="w-5 h-5"></i>
              <span
                id="cartBadge"
                class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center p-0 bg-gradient-to-r from-orange-500 to-orange-600 text-[10px] border-2 border-white text-white rounded-full"
                >0</span
              >
            </button>
            <button
              onclick="gestionarNotificaciones()"
              class="relative text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="bell" class="w-5 h-5"></i
              ><span
                class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center p-0 bg-gradient-to-r from-orange-500 to-orange-600 text-[10px] border-2 border-white text-white rounded-full"
                >3</span
              >
            </button>
            <div class="h-6 w-px bg-gray-200"></div>
            <button
              data-nav-id="profile"
              class="text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <div
                class="w-8 h-8 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white"
              >
                <i data-lucide="user" class="w-5 h-5"></i>
              </div>
            </button>
            <button
              onclick="gestionarNavegacion('logout')"
              class="text-gray-600 hover:text-red-600 hover:bg-red-50 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
        <!-- Mobile Nav -->
        <div
          class="md:hidden flex items-center gap-2 pb-4 overflow-x-auto scrollbar-hide"
        >
          <button
            data-nav-id="home"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="home" class="w-4 h-4 mr-2"></i> Inicio
          </button>
          <button
            data-nav-id="shop"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="shopping-bag" class="w-4 h-4 mr-2"></i> Tienda
          </button>
          <button
            data-nav-id="bookings"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="calendar" class="w-4 h-4 mr-2"></i> Reservas
          </button>
          <button
            data-nav-id="social"
            class="flex-shrink-0 transition-all duration-300 bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-md shadow-orange-500/20 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="users" class="w-4 h-4 mr-2"></i> Comunidad
          </button>
        </div>
      </div>
    </nav>

    <div class="min-h-screen bg-gradient-to-b from-gray-50 to-white py-8">
      <div class="container mx-auto px-6">
        <div class="grid lg:grid-cols-3 gap-8">
          <!-- Main Feed -->
          <div class="lg:col-span-2 space-y-6">
            <!-- Create Post -->
            <div
              class="rounded-xl border bg-card text-card-foreground shadow p-6 border-gray-200 bg-white shadow-sm"
            >
              <div class="flex gap-4">
                <div
                  class="w-12 h-12 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white shadow-md font-bold"
                >
                  TU
                </div>
                <div class="flex-1">
                  <textarea
                    id="postInput"
                    placeholder="¿Qué estás entrenando hoy?"
                    class="flex w-full rounded-md border border-input bg-background px-3 py-2 ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 text-sm min-h-[100px] mb-4 border-gray-200 focus:border-orange-500 focus:ring-orange-500/20 resize-none"
                  ></textarea>
                  <div class="flex items-center justify-between">
                    <div class="flex gap-2">
                      <button
                        onclick="gestionarNoImplementado('Subir foto')"
                        class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border bg-background h-9 px-3 border-gray-200 hover:border-orange-300 hover:bg-orange-50"
                      >
                        <i
                          data-lucide="image"
                          class="w-4 h-4 mr-2 text-orange-500"
                        ></i>
                        Foto
                      </button>
                      <button
                        onclick="gestionarNoImplementado('Subir video')"
                        class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border bg-background h-9 px-3 border-gray-200 hover:border-orange-300 hover:bg-orange-50"
                      >
                        <i
                          data-lucide="camera"
                          class="w-4 h-4 mr-2 text-orange-500"
                        ></i>
                        Video
                      </button>
                    </div>
                    <button
                      id="publishBtn"
                      class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 px-4 py-2 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 shadow-md shadow-orange-500/20 text-white"
                    >
                      Publicar
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Feed Container -->
            <div id="feedContainer" class="space-y-6">
              <!-- Posts appended here by JS -->
            </div>
          </div>

          <!-- Sidebar (Static) -->
          <div class="space-y-6">
            <div
              class="rounded-xl border bg-card text-card-foreground shadow p-6 border-gray-200 bg-gradient-to-br from-white to-orange-50/30 shadow-sm"
            >
              <div class="flex items-center gap-4 mb-6">
                <div class="relative">
                  <div
                    class="w-16 h-16 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-500/30 font-bold"
                  >
                    TU
                  </div>
                  <div
                    class="absolute -bottom-1 -right-1 w-6 h-6 bg-green-500 rounded-full border-2 border-white"
                  ></div>
                </div>
                <div>
                  <div class="text-lg font-medium">Mi Perfil</div>
                  <div class="text-sm text-gray-600">@miusuario</div>
                  <div
                    class="inline-flex items-center rounded-full border px-2.5 py-0.5 font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 mt-1 bg-orange-100 text-orange-700 border-orange-200 text-xs"
                  >
                    <i data-lucide="flame" class="w-3 h-3 mr-1"></i> Nivel Pro
                  </div>
                </div>
              </div>
              <button
                data-nav-id="profile"
                class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-10 px-4 py-2 w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 shadow-md shadow-orange-500/20 text-white"
              >
                Editar Perfil
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/Funcionalidad/global.js"></script>
    <script src="/Funcionalidad/social.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
