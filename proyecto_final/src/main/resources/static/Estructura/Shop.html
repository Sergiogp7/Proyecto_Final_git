<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymCore - Tienda</title>
    <link rel="stylesheet" href="../Estilos/estilos.css" />
    <link rel="stylesheet" href="../Estilos/premium.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-gray-50">
    <nav
      class="glass-nav sticky top-0 z-50 transition-all duration-300"
    >
      <div class="container mx-auto px-6">
        <div class="flex items-center justify-between h-20">
          <div
            class="flex items-center gap-3 cursor-pointer group"
            onclick="window.location.href = 'Home.html'"
          >
            <div
              class="bg-gradient-to-br from-orange-500 to-orange-600 p-2.5 rounded-xl shadow-md shadow-orange-500/20 group-hover:shadow-lg group-hover:shadow-orange-500/30 transition-all duration-300"
            >
              <i data-lucide="dumbbell" class="w-6 h-6 text-white"></i>
            </div>
            <div>
              <span
                class="block text-2xl tracking-tight bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent font-bold"
                >GymCore</span
              >
              <span
                class="block text-[10px] text-gray-500 tracking-wider -mt-0.5 font-medium"
                >ELITE FITNESS</span
              >
            </div>
          </div>
          <div class="hidden md:flex items-center gap-2">
            <button
              data-nav-id="home"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="home" class="w-4 h-4 mr-2"></i> Inicio
            </button>
            <button
              data-nav-id="shop"
              class="relative h-11 px-4 transition-all duration-300 bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-md shadow-orange-500/20 hover:shadow-lg hover:shadow-orange-500/30 rounded-md flex items-center"
            >
              <i data-lucide="shopping-bag" class="w-4 h-4 mr-2"></i> Tienda
              <div
                class="absolute -bottom-[21px] left-1/2 -translate-x-1/2 w-1/2 h-0.5 bg-gradient-to-r from-transparent via-orange-500 to-transparent"
              ></div>
            </button>
            <button
              data-nav-id="bookings"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="calendar" class="w-4 h-4 mr-2"></i> Reservas
            </button>
            <button
              data-nav-id="social"
              class="relative h-11 px-4 transition-all duration-300 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-md flex items-center"
            >
              <i data-lucide="users" class="w-4 h-4 mr-2"></i> Comunidad
            </button>
          </div>
          <div class="flex items-center gap-3">
            <button
              onclick="gestionarCarrito()"
              data-nav-id="cart"
              class="relative text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="shopping-cart" class="w-5 h-5"></i>
              <span
                id="cartBadge"
                class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center p-0 bg-gradient-to-r from-orange-500 to-orange-600 text-[10px] border-2 border-white text-white rounded-full"
                >0</span
              >
            </button>
            <button
              onclick="gestionarNotificaciones()"
              class="relative text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="bell" class="w-5 h-5"></i>
              <span
                id="notificationBadge"
                class="absolute -top-1 -right-1 h-5 w-5 flex items-center justify-center p-0 bg-gradient-to-r from-orange-500 to-orange-600 text-[10px] border-2 border-white text-white rounded-full"
                >3</span
              >
            </button>
            <div class="h-6 w-px bg-gray-200"></div>
            <button
              onclick="gestionarNavegacion('profile')"
              data-nav-id="profile"
              class="text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-300 p-2 rounded-md"
            >
              <div
                class="w-8 h-8 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white"
              >
                <i data-lucide="user" class="w-5 h-5"></i>
              </div>
            </button>
            <button
              onclick="gestionarNavegacion('logout')"
              class="text-gray-600 hover:text-red-600 hover:bg-red-50 transition-all duration-300 p-2 rounded-md"
            >
              <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
        <div
          class="md:hidden flex items-center gap-2 pb-4 overflow-x-auto scrollbar-hide"
        >
          <button
            data-nav-id="home"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="home" class="w-4 h-4 mr-2"></i> Inicio
          </button>
          <button
            data-nav-id="shop"
            class="flex-shrink-0 transition-all duration-300 bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-md shadow-orange-500/20 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="shopping-bag" class="w-4 h-4 mr-2"></i> Tienda
          </button>
          <button
            data-nav-id="bookings"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="calendar" class="w-4 h-4 mr-2"></i> Reservas
          </button>
          <button
            data-nav-id="social"
            class="flex-shrink-0 transition-all duration-300 bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm px-3 py-1.5 rounded-md flex items-center"
          >
            <i data-lucide="users" class="w-4 h-4 mr-2"></i> Comunidad
          </button>
        </div>
      </div>
    </nav>

    <div class="min-h-screen bg-gradient-to-b from-gray-50 to-white py-12">
      <div class="container mx-auto px-6">
        <div class="mb-12 space-y-4">
          <div
            class="inline-flex items-center rounded-full border px-4 py-1.5 text-xs font-semibold bg-orange-100 text-orange-700 border-orange-200"
          >
            <i data-lucide="sparkles" class="w-3.5 h-3.5 mr-1.5"></i> Más de 500
            productos premium
          </div>
          <h1
            class="text-5xl tracking-tight bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent font-medium"
          >
            Tienda GymCore
          </h1>
          <p
            class="text-gray-600 text-xl leading-relaxed max-w-3xl font-normal"
          >
            Los mejores productos para llevar tu entrenamiento al siguiente
            nivel.
          </p>
        </div>

        <div class="mb-10 flex flex-col sm:flex-row gap-4">
          <div class="relative flex-1 max-w-md">
            <i
              data-lucide="search"
              class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
            ></i>
            <input
              id="searchInput"
              type="text"
              placeholder="Buscar productos..."
              class="w-full pl-12 h-14 border border-gray-200 rounded-md bg-white shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all outline-none"
            />
          </div>
        </div>

        <div class="mb-12">
          <div
            class="grid w-full max-w-2xl grid-cols-4 h-auto p-1 bg-gray-100 rounded-xl"
          >
            <button
              data-tab-category="all"
              class="category-tab h-12 rounded-lg text-sm font-medium transition-all duration-300 bg-white text-gray-900 shadow-sm"
            >
              Todos
            </button>
            <button
              data-tab-category="Suplementos"
              class="category-tab h-12 rounded-lg text-sm font-medium transition-all duration-300 text-gray-500 hover:text-gray-900"
            >
              Suplementos
            </button>
            <button
              data-tab-category="Equipamiento"
              class="category-tab h-12 rounded-lg text-sm font-medium transition-all duration-300 text-gray-500 hover:text-gray-900"
            >
              Equipamiento
            </button>
            <button
              data-tab-category="Accesorios"
              class="category-tab h-12 rounded-lg text-sm font-medium transition-all duration-300 text-gray-500 hover:text-gray-900"
            >
              Accesorios
            </button>
          </div>
        </div>

        <div
          id="productList"
          class="grid md:grid-cols-3 lg:grid-cols-4 gap-6"
        ></div>
      </div>
    </div>

    <div
      id="toast"
      class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300"
    >
      <div
        class="bg-gray-900 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3"
      >
        <div class="bg-green-500 rounded-full p-1">
          <i data-lucide="check" class="w-4 h-4 text-white"></i>
        </div>
        <div>
          <h4 class="font-medium">Producto añadido</h4>
          <p class="text-sm text-gray-400">
            Se ha añadido correctamente al carrito
          </p>
        </div>
      </div>
    </div>

    <script src="/Funcionalidad/global.js"></script>
    <script src="/Funcionalidad/shop.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
