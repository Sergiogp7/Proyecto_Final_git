<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymCore - Registrarse</title>
    <link rel="stylesheet" href="Estilos/estilos.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-white">
    <div class="min-h-screen flex">
      <!-- Left side - Form -->
      <div
        class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-gradient-to-br from-white to-orange-50/30"
      >
        <div class="w-full max-w-md space-y-8 animate-in fade-in duration-500">
          <!-- Logo -->
          <div class="flex items-center gap-3">
            <div
              class="bg-gradient-to-br from-orange-500 to-orange-600 p-3 rounded-2xl shadow-lg shadow-orange-500/20"
            >
              <i data-lucide="dumbbell" class="w-8 h-8 text-white"></i>
            </div>
            <div>
              <span
                class="block text-3xl tracking-tight bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent font-bold"
              >
                GymCore
              </span>
              <span
                class="block text-xs text-gray-500 tracking-wide font-medium"
                >ELITE FITNESS</span
              >
            </div>
          </div>

          <!-- Title -->
          <div class="space-y-3">
            <h1
              class="text-4xl tracking-tight bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 bg-clip-text text-transparent font-medium"
            >
              Crea tu cuenta gratis
            </h1>
            <p class="text-gray-600 text-lg leading-relaxed">
              Empieza tu transformación hoy mismo
            </p>
          </div>

          <!-- Form -->
          <form id="registroForm" class="space-y-5">
            <div class="space-y-2">
              <label for="nombre" class="text-gray-700 font-medium"
                >Nombre Completo</label
              >
              <div class="relative">
                <i
                  data-lucide="user"
                  class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
                ></i>
                <input
                  id="nombre"
                  type="text"
                  placeholder="Juan"
                  class="w-full h-12 pl-12 border border-gray-200 rounded-md bg-white shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all outline-none"
                  required
                />
              </div>
            </div>

            <div class="space-y-2">
              <label for="apellidos" class="text-gray-700 font-medium"
                >Apellidos</label
              >
              <div class="relative">
                <i
                  data-lucide="user"
                  class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
                ></i>
                <input
                  id="apellidos"
                  type="text"
                  placeholder="Pérez"
                  class="w-full h-12 pl-12 border border-gray-200 rounded-md bg-white shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all outline-none"
                  required
                />
              </div>
            </div>

            <div class="space-y-2">
              <label for="username" class="text-gray-700 font-medium"
                >Nombre de Usuario</label
              >
              <div class="relative">
                <i
                  data-lucide="at-sign"
                  class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
                ></i>
                <input
                  id="username"
                  type="text"
                  placeholder="Sergio2006"
                  class="w-full h-12 pl-12 border border-gray-200 rounded-md bg-white shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all outline-none"
                  required
                />
              </div>
            </div>

            <div class="space-y-2">
              <label for="email" class="text-gray-700 font-medium">Email</label>
              <div class="relative">
                <i
                  data-lucide="mail"
                  class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
                ></i>
                <input
                  id="email"
                  type="email"
                  placeholder="tu@email.com"
                  class="w-full h-12 pl-12 border border-gray-200 rounded-md bg-white shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all outline-none"
                  required
                />
              </div>
            </div>

            <div class="space-y-2">
              <label for="password" class="text-gray-700 font-medium"
                >Contraseña</label
              >
              <div class="relative">
                <i
                  data-lucide="lock"
                  class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
                ></i>
                <input
                  id="password"
                  type="password"
                  placeholder="••••••••"
                  class="w-full h-12 pl-12 border border-gray-200 rounded-md bg-white shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all outline-none"
                  required
                />
              </div>
            </div>

            <button
              id="RegistroBtn"
              type="submit"
              class="w-full h-14 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white rounded-md shadow-lg shadow-orange-500/30 hover:shadow-xl hover:shadow-orange-500/40 transition-all duration-300 text-base font-medium flex items-center justify-center mt-6"
            >
              Registrarse
            </button>
          </form>

          <div class="text-center">
            <span class="text-sm text-gray-600">
              ¿Ya tienes cuenta?
              <a
                href="index.html"
                class="bg-gradient-to-r from-orange-600 to-orange-500 bg-clip-text text-transparent cursor-pointer hover:from-orange-700 hover:to-orange-600 transition-all font-medium"
              >
                Inicia sesión
              </a>
            </span>
          </div>
        </div>
      </div>

      <div
        class="hidden lg:block lg:w-1/2 bg-cover bg-center relative"
        style="
          background-image: url(&quot;https://images.unsplash.com/photo-1756115484694-009466dbaa67?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxneW0lMjB3b3Jrb3V0JTIwZml0bmVzc3xlbnwxfHx8fDE3NjIwNjY2ODN8MA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral&quot;);
        "
      >
        <div
          class="absolute inset-0 bg-gradient-to-br from-black/60 via-black/50 to-orange-900/40 flex items-center justify-center p-12"
        >
          <div
            class="text-white text-center max-w-lg space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700"
          >
            <div class="space-y-4">
              <h2 class="text-6xl tracking-tight font-medium">
                Únete al equipo
              </h2>
              <div
                class="h-1 w-24 bg-gradient-to-r from-orange-500 to-orange-400 mx-auto rounded-full"
              ></div>
            </div>
            <p class="text-xl text-white/90 leading-relaxed font-normal">
              Obtén acceso ilimitado a cientos de entrenamientos de clase
              mundial.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="Funcionalidad/global.js"></script>
    <script src="Funcionalidad/registro.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
